name: Update README cards

on:
  schedule:
    # 02:47 IST
    - cron: "17 21 * * *"
  workflow_dispatch:

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stats light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=kaustubhupadhyaya&show_icons=true&hide_rank=true&hide_border=true&theme=light_github
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=kaustubhupadhyaya&show_icons=true&hide_rank=true&hide_border=true&theme=dark_github
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=kaustubhupadhyaya&layout=compact&langs_count=6&card_width=320&hide_border=true&theme=light_github
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=kaustubhupadhyaya&layout=compact&langs_count=6&card_width=320&hide_border=true&theme=dark_github
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: nano-banana-facecard light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=nano-banana-facecard&hide_border=true&theme=light_github_repocard
          path: profile/pin-nano-banana-facecard-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: nano-banana-facecard dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=nano-banana-facecard&hide_border=true&theme=dark_github_repocard
          path: profile/pin-nano-banana-facecard-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: alpha-round3-lab light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=alpha-round3-lab&hide_border=true&theme=light_github_repocard
          path: profile/pin-alpha-round3-lab-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: alpha-round3-lab dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=alpha-round3-lab&hide_border=true&theme=dark_github_repocard
          path: profile/pin-alpha-round3-lab-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: second-brain-toolkit light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=second-brain-toolkit&hide_border=true&theme=light_github_repocard
          path: profile/pin-second-brain-toolkit-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: second-brain-toolkit dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=second-brain-toolkit&hide_border=true&theme=dark_github_repocard
          path: profile/pin-second-brain-toolkit-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: digital-profile-creator light
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=digital-profile-creator&hide_border=true&theme=light_github_repocard
          path: profile/pin-digital-profile-creator-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: digital-profile-creator dark
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=digital-profile-creator&hide_border=true&theme=dark_github_repocard
          path: profile/pin-digital-profile-creator-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git rm -f profile/stats.svg profile/top-langs.svg profile/pin-nano-banana-facecard.svg profile/pin-alpha-round3-lab.svg profile/pin-second-brain-toolkit.svg profile/pin-digital-profile-creator.svg || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
