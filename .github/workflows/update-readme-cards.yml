name: Update README cards

on:
  schedule:
    # 02:47 IST
    - cron: "17 21 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=kaustubhupadhyaya&show_icons=true&hide_rank=true&theme=transparent&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=kaustubhupadhyaya&layout=compact&langs_count=6&card_width=320&theme=transparent&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate nano-banana-facecard card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=nano-banana-facecard&theme=transparent&hide_border=true
          path: profile/pin-nano-banana-facecard.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate alpha-round3-lab card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=alpha-round3-lab&theme=transparent&hide_border=true
          path: profile/pin-alpha-round3-lab.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate second-brain-toolkit card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=second-brain-toolkit&theme=transparent&hide_border=true
          path: profile/pin-second-brain-toolkit.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate digital-profile-creator card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=kaustubhupadhyaya&repo=digital-profile-creator&theme=transparent&hide_border=true
          path: profile/pin-digital-profile-creator.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
